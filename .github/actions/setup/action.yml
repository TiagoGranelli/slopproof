name: Setup
description: pnpm (package.json#packageManager), Node (package.json#devEngines.runtime), cached store, frozen install, optional Playwright/Caddy caches.
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`. Jobs whose script needs only Node and Docker skip it.
    default: 'true'
  trust-lockfile:
    description: Skip re-verifying minimumReleaseAge and trustPolicy during frozen install (set to 'false' in repo-guards).
    default: 'true'
  save-cache:
    description: Save the pnpm store cache (set to 'false' in downstream jobs that only read the cache).
    default: 'true'
  caddy:
    description: Cache and expose the pinned Caddy binary from scripts/images.ts via EDGE_RUNTIME=binary and CADDY_BIN (Linux only).
    default: 'false'
  browsers:
    description: Space-separated Playwright browsers to install (cached), with their system dependencies, e.g. `chromium-headless-shell firefox`.
    default: ''
runs:
  using: composite
  steps:
    - if: inputs.install == 'true' && (runner.os == 'Windows' || runner.os == 'Linux')
      shell: bash
      run: |
        if [ "${RUNNER_OS:-}" = 'Windows' ] && [ -z "${PNPM_CONFIG_STORE_DIR:-}" ] && [ -d /d ]; then
          echo 'PNPM_CONFIG_STORE_DIR=D:\.pnpm-store' >> "$GITHUB_ENV"
        elif [ "${RUNNER_OS:-}" = 'Linux' ] && [ -z "${PNPM_CONFIG_STORE_DIR:-}" ] && [ -d /__w ]; then
          case "${GITHUB_WORKSPACE:-}" in
            /__w/*) echo 'PNPM_CONFIG_STORE_DIR=/__w/.pnpm-store' >> "$GITHUB_ENV" ;;
          esac
        fi
    - if: inputs.install == 'true'
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        save-cache: ${{ inputs.save-cache }}
        install: false
    - if: inputs.install != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        package-manager-cache: false
    - if: inputs.install == 'true'
      shell: bash
      env:
        SAVE_CACHE: ${{ inputs.save-cache }}
        TRUST_LOCKFILE: ${{ inputs.trust-lockfile }}
      run: |
        if [ "$TRUST_LOCKFILE" = 'false' ]; then
          cache_dir=$(pnpm config get cache-dir | tr -d '\r')
          if [ -n "$cache_dir" ]; then
            rm -f "$cache_dir/lockfile-verified.jsonl"
          fi
          pnpm install --frozen-lockfile --no-runtime --ignore-scripts
        else
          pnpm install --frozen-lockfile --trust-lockfile --prefer-offline --no-runtime --ignore-scripts
        fi
        if [ "$SAVE_CACHE" = 'true' ] && [ "${RUNNER_OS:-}" != 'Windows' ]; then
          pnpm store prune
        fi
    - id: caddy
      if: runner.os == 'Linux' && inputs.caddy == 'true'
      shell: bash
      run: |
        caddy_image=$(node -e "import('./scripts/images.ts').then((m) => console.log(m.IMAGES.caddy))")
        digest=${caddy_image#*@sha256:}
        if [ -z "$digest" ] || [ "$digest" = "$caddy_image" ]; then
          echo "Missing @sha256: digest in IMAGES.caddy: $caddy_image" >&2
          exit 1
        fi
        caddy_dir="$HOME/.cache/caddy/$digest"
        printf 'image=%s\ndigest=%s\ndir=%s\n' "$caddy_image" "$digest" "$caddy_dir" >> "$GITHUB_OUTPUT"
    - id: caddy-cache
      if: runner.os == 'Linux' && inputs.caddy == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.caddy.outputs.dir }}
        key: caddy-${{ runner.os }}-${{ runner.arch }}-${{ steps.caddy.outputs.digest }}
    - if: runner.os == 'Linux' && inputs.caddy == 'true'
      shell: bash
      env:
        CADDY_IMAGE: ${{ steps.caddy.outputs.image }}
        CADDY_DIR: ${{ steps.caddy.outputs.dir }}
      run: |
        if [ ! -x "$CADDY_DIR/caddy" ]; then
          mkdir -p "$CADDY_DIR"
          cid=$(docker create "$CADDY_IMAGE") && docker cp "$cid:/usr/bin/caddy" "$CADDY_DIR/caddy" && docker rm "$cid" && chmod +x "$CADDY_DIR/caddy"
        fi
        node -e "const fs=require('node:fs'),d=process.env.CADDY_DIR;if(!d||/[\r\n]/.test(d))throw new Error('Invalid CADDY_DIR');fs.appendFileSync(process.env.GITHUB_ENV,'EDGE_RUNTIME=binary\nCADDY_BIN='+d+'/caddy\n')"
    - id: playwright
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      # The cache key names the Playwright version and the browser set, so adding a browser misses the cache.
      run: |
        cache_dir=$(node -p "const os=require('node:os'),p=require('node:path'),f=process.platform;p.join(f==='win32'?(process.env.LOCALAPPDATA||p.join(os.homedir(),'AppData','Local')):f==='darwin'?p.join(os.homedir(),'Library','Caches'):(process.env.XDG_CACHE_HOME||p.join(os.homedir(),'.cache')),'ms-playwright')" | tr -d '\r')
        pw_version=$(pnpm exec playwright --version | cut -d' ' -f2 | tr -d '\r')
        printf 'path=%s\nversion=%s\nbrowsers=%s\n' \
          "$cache_dir" "$pw_version" "$(tr -s ' ' '\n' <<< "$BROWSERS" | sort | paste -sd- -)" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: inputs.browsers != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.playwright.outputs.path }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}
    - if: inputs.browsers != '' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browsers <<< "$BROWSERS"
        pnpm exec playwright install "${browsers[@]}"
    # Browsers live in the workspace/runner cache while system libraries live in the OS image. Checking `ldd`
    # on both cache hits and misses skips slow redundant `apt-get` runs for Chromium on ubuntu-24.04 (which
    # already ships Chrome's shared libraries) while installing missing `.so` deps for Firefox and WebKit.
    - if: runner.os == 'Linux' && inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PW_DIR: ${{ steps.playwright.outputs.path }}
      run: |
        lib_dirs=$(find "$PW_DIR" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -)
        missing=$(LD_LIBRARY_PATH="${lib_dirs}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" find "$PW_DIR" -type f \( -perm -u+x -o -name '*.so*' \) -exec ldd {} + 2>/dev/null | grep 'not found' | sort -u || true)
        if [ -n "$missing" ]; then
          echo "$missing"
          read -ra browsers <<< "$BROWSERS"
          pnpm exec playwright install-deps "${browsers[@]}"
        fi
