name: Setup
description: pnpm (package.json#packageManager), Node (package.json#devEngines.runtime), cached store, frozen install, optional Vitest/Playwright caches.
inputs:
  install:
    description: Run `pnpm install --frozen-lockfile`. Jobs whose script needs only Node and Docker skip it.
    default: 'true'
  trust-lockfile:
    description: Skip re-verifying minimumReleaseAge and trustPolicy during frozen install (set to 'false' in supply-chain).
    default: 'true'
  save-cache:
    description: Save the pnpm store cache (set to 'false' in downstream jobs that only read the cache).
    default: 'true'
  vitest-cache:
    description: Cache Vitest pre-bundled browser dependencies (node_modules/.vite/vitest).
    default: 'false'
  browsers:
    description: Space-separated Playwright browsers to install (cached), with their system dependencies, e.g. `chromium-headless-shell firefox`.
    default: ''
runs:
  using: composite
  steps:
    - if: inputs.install == 'true'
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        save-cache: ${{ inputs.save-cache }}
        install: false
    - if: inputs.install != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json
        package-manager-cache: false
    - if: inputs.install == 'true'
      shell: bash
      env:
        TRUST_LOCKFILE: ${{ inputs.trust-lockfile }}
      run: |
        if [ "$TRUST_LOCKFILE" = 'false' ]; then
          cache_dir=$(pnpm config get cache-dir | tr -d '\r')
          if [ -n "$cache_dir" ]; then
            rm -f "$cache_dir/lockfile-verified.jsonl"
          fi
          pnpm install --frozen-lockfile --no-runtime --ignore-scripts
        else
          pnpm install --frozen-lockfile --trust-lockfile --prefer-offline --no-runtime --ignore-scripts
        fi
    - if: inputs.vitest-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.vite/vitest
        key: vitest-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'vitest.config.ts') }}
    - id: playwright
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      # The cache key names the Playwright version and the browser set, so adding a browser misses the cache.
      run: |
        cache_dir=$(node -p "const os=require('node:os'),p=require('node:path'),f=process.platform;p.join(f==='win32'?(process.env.LOCALAPPDATA||p.join(os.homedir(),'AppData','Local')):f==='darwin'?p.join(os.homedir(),'Library','Caches'):(process.env.XDG_CACHE_HOME||p.join(os.homedir(),'.cache')),'ms-playwright')" | tr -d '\r')
        pw_version=$(pnpm exec playwright --version | cut -d' ' -f2 | tr -d '\r')
        printf 'path=%s\nversion=%s\nbrowsers=%s\n' \
          "$cache_dir" "$pw_version" "$(tr -s ' ' '\n' <<< "$BROWSERS" | sort | paste -sd- -)" >> "$GITHUB_OUTPUT"
    - id: playwright-cache
      if: inputs.browsers != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.playwright.outputs.path }}
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.browsers }}
    - if: inputs.browsers != '' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        read -ra browsers <<< "$BROWSERS"
        pnpm exec playwright install "${browsers[@]}"
    # Browsers live in the workspace/runner cache while system libraries live in the OS image. Checking `ldd`
    # on both cache hits and misses skips slow redundant `apt-get` runs for Chromium on ubuntu-24.04 (which
    # already ships Chrome's shared libraries) while installing missing `.so` deps for Firefox and WebKit.
    - if: runner.os == 'Linux' && inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
        PW_DIR: ${{ steps.playwright.outputs.path }}
      run: |
        lib_dirs=$(find "$PW_DIR" -type f -name '*.so*' -printf '%h\n' | sort -u | paste -sd: -)
        missing=$(LD_LIBRARY_PATH="${lib_dirs}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" find "$PW_DIR" -type f \( -perm -u+x -o -name '*.so*' \) -exec ldd {} + 2>/dev/null | grep 'not found' | sort -u || true)
        if [ -n "$missing" ]; then
          echo "$missing"
          read -ra browsers <<< "$BROWSERS"
          pnpm exec playwright install-deps "${browsers[@]}"
        fi
