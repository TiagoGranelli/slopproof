name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the running check. Runs on main always finish, so every commit there
# gets a complete result. The minimal branch has its own workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job only provides tooling and services and runs one `scripts/ci-jobs.ts` script (`pnpm ci:<job>` when npm
# dependencies are installed, or `node scripts/ci-jobs.ts <job>` when `install: 'false'`), so `pnpm ci:local <job>`
# reproduces it locally. Job logic belongs in the scripts, not here.
env:
  CI: true
  # Matches the postgres service below. Test databases (*_test) are created next to it by the scripts.
  DATABASE_URL: postgres://app:app-ci@localhost:5432/app

jobs:
  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: node scripts/ci-jobs.ts workflows

  static:
    name: Static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit is the baseline of the `security` job and the applied-migrations test (CHECK_BASE_REF).
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          # The component tests in `pnpm check` run in Chromium (Vitest browser mode).
          browsers: chromium-headless-shell
          vitest-cache: 'true'
      - run: pnpm ci:static

  # The same static gates on Windows, so a script that only works on Linux and macOS (a `.cmd` shim started
  # without a shell, a path joined with `/`) shows up. Not a gate yet: it has not had a green run, and Windows
  # minutes cost more, so it runs on main and on demand, not on every pull request.
  static-windows:
    name: Static gates on Windows (not blocking)
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          browsers: chromium-headless-shell
          vitest-cache: 'true'
      - run: pnpm ci:static

  supply-chain:
    name: Supply chain (release age, trust, signatures, advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The frozen install verifies every lockfile entry against minimumReleaseAge and trustPolicy.
      - uses: ./.github/actions/setup
        with:
          trust-lockfile: 'false'
      - run: pnpm ci:supply-chain

  secrets:
    name: Secret scan (Betterleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, not only the tree: a secret removed later is still in the history.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - run: node scripts/ci-jobs.ts secrets

  drift:
    name: Contract and database drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres: &postgres
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app-ci
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm ci:drift

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm ci:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output
          path: .output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  verify-core:
    name: Verify API, DB and integration
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres: *postgres
      # Integration and E2E send account emails here (default ports of verify:app).
      mailpit: &mailpit
        image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
        ports:
          - 54325:1025
          - 54380:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: output
          path: .output
      - run: pnpm ci:verify -- --only=core
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-core-report
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  verify-e2e:
    name: Verify E2E (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium-headless-shell
            name: chromium
            project: chromium
            shard: ''
          - browser: chromium-headless-shell
            name: pixel-7
            project: Pixel 7
            shard: ''
          - browser: firefox
            name: firefox-1
            project: firefox
            shard: '1/2'
          - browser: firefox
            name: firefox-2
            project: firefox
            shard: '2/2'
    services:
      postgres: *postgres
      mailpit: *mailpit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          browsers: ${{ matrix.browser }}
          save-cache: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: output
          path: .output
      - env:
          PW_PROJECTS: ${{ matrix.project }}
          PW_SHARD: ${{ matrix.shard }}
        run: pnpm ci:verify -- --only=e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-e2e-${{ matrix.name }}
          # test-results/app-server-e2e.log (server output), test-results/playwright (traces), playwright-report.
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  verify-e2e-webkit:
    name: Verify E2E (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    services:
      db: *postgres
      mailpit: *mailpit
    env:
      DATABASE_URL: postgres://app:app-ci@db:5432/app
      MAILPIT_HOST: mailpit
      MAILPIT_SMTP_PORT: '1025'
      MAILPIT_HTTP_PORT: '8025'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: webkit-1
            project: webkit
            shard: '1/2'
          - name: webkit-2
            project: webkit
            shard: '2/2'
          - name: iphone-15
            project: iPhone 15
            shard: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: 'false'
      - run: pnpm ci:build
      - env:
          PW_PROJECTS: ${{ matrix.project }}
          PW_SHARD: ${{ matrix.shard }}
        run: pnpm ci:verify -- --only=e2e
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-e2e-${{ matrix.name }}
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse (${{ matrix.page }}, ${{ matrix.form_factor }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
        page: [home, about, login, dashboard]
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          save-cache: 'false'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: output
          path: .output
      - env:
          CHROME_PATH: /usr/bin/google-chrome
          LH_FORM_FACTOR: ${{ matrix.form_factor }}
          LH_PAGE: ${{ matrix.page }}
        run: pnpm ci:lighthouse -- "--page=$LH_PAGE" "--form-factor=$LH_FORM_FACTOR"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Includes app-server.log and edge.log.
          name: lighthouse-report-${{ matrix.page }}-${{ matrix.form_factor }}
          path: lighthouse-report
          retention-days: 14

  docker:
    name: Docker image (build, migrate, serve behind the edge)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - id: grype-cache-meta
        shell: bash
        run: |
          grype_dir="$HOME/.cache/grype-db"
          mkdir -p "$grype_dir"
          printf 'today=%s\ngrype_dir=%s\n' "$(date -u +%F)" "$grype_dir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.grype-cache-meta.outputs.grype_dir }}
          key: grype-db-${{ runner.os }}-${{ steps.grype-cache-meta.outputs.today }}
          restore-keys: grype-db-${{ runner.os }}-
      - env:
          GRYPE_DB_DIR: ${{ steps.grype-cache-meta.outputs.grype_dir }}
        run: node scripts/ci-jobs.ts docker
      - if: always()
        shell: bash
        env:
          GRYPE_DB_DIR: ${{ steps.grype-cache-meta.outputs.grype_dir }}
        run: sudo chown -R "$(id -u):$(id -g)" "$GRYPE_DB_DIR"
